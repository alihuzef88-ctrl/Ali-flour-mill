<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali Flour Mill</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
<h1>🌾 Ali Flour Mill</h1>
<p>Near Ali Tower, Malthana Road, Adgaon BK</p>
<h3>📞 7276065313</h3>
</header>

<div class="container">

<div class="card">

<h2>Customer Entry</h2>

<input type="text" id="name" placeholder="Customer Name"><br><br>

<input type="date" id="date"><br><br>

<input type="number" id="kg" placeholder="Total KG" onkeyup="calculateTotal()"><br><br>

<input type="number" id="rate" placeholder="₹ Per KG" onkeyup="calculateTotal()"><br><br>

<input type="number" id="total" placeholder="Total Amount" readonly><br><br>

<input type="number" id="paid" placeholder="Paid Amount" onkeyup="calculateBalance()"><br><br>

<input type="number" id="balance" placeholder="Balance" readonly><br><br>

<button class="btn" onclick="saveEntry()">Save Entry</button>

</div>

</div>

<!-- LIST SHOW AREA -->
<div id="list" class="container"></div>

<script src="script.js"></script>

</body>
</html>
